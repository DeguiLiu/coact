name: CI

on:
  push:
    branches: [master, windows]
    tags: ['v*']
  pull_request:
    branches: [master, windows]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

# A same-repo push to `windows` also fires pull_request when a PR is open, so
# the same commit can otherwise queue two runs. Cancel the stale one per ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux host suite, full scope (POSIX PAL, RT-Thread host stub, coro, timer).
  host-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, RelWithDebInfo]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ASan cannot map its shadow under kernel 6.5+ high-entropy ASLR
      # (vm.mmap_rnd_bits=32); the default runner image hits this and every
      # sanitized binary dies with DEADLYSIGNAL before main().
      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure (ASan/UBSan)
        run: cmake -B build-san -S . -DCMAKE_BUILD_TYPE=Debug \
               -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
               -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san -j 4
      - name: Test
        # UBSan recovers by default: it prints "runtime error" and exits 0, so
        # ctest would report a pass. halt_on_error turns any UB into a failure.
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  # ThreadSanitizer gate. The lock-free paths (pool SMP free list, staging
  # publication, dispatcher lease, admission snapshot) only show up as races
  # under TSan; ASan/UBSan cannot see them. setarch -R disables ASLR because
  # GCC libtsan cannot map its shadow ranges under kernel 6.5+ high-entropy
  # ASLR. Thread leaks are suppressed: the FreeRTOS/RT-Thread host stubs back
  # their tasks with pthreads that outlive the test on purpose.
  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (TSan)
        run: cmake -B build-tsan -S . -DCMAKE_BUILD_TYPE=Debug \
               -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -fno-omit-frame-pointer" \
               -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan -j 4

      # Each binary is judged only on ThreadSanitizer output. Assertion
      # failures and leaks are the host-test job's business; this job fails
      # exactly when a data race is reported.
      - name: Run every test binary under TSan
        env:
          TSAN_OPTIONS: report_thread_leaks=0:halt_on_error=0
        run: |
          set -u
          fails=0
          total=0
          for b in $(find build-tsan -name 'test_*' -type f -executable | sort); do
            total=$((total+1))
            out=$(setarch "$(uname -m)" -R "$b" 2>&1) || true
            if printf '%s\n' "$out" | grep -q "WARNING: ThreadSanitizer"; then
              echo "=== RACE in $b"
              printf '%s\n' "$out" | grep -A25 "WARNING: ThreadSanitizer" | head -50
              fails=$((fails+1))
            fi
          done
          if [ "$fails" -ne 0 ]; then
            echo "TSan: $fails of $total binaries reported a race"
            exit 1
          fi
          echo "TSan: $total binaries clean"

  # Target-ABI compile gate. The Renode scripts compile these translation
  # units on the bench; without this job a FreeRTOS-only break (missing
  # INCLUDE_* macro, static_assert on target, #error gate) lands on master
  # before anyone runs Renode. Compile only: no kernel link, no emulator.
  arm-cross:
    name: arm-cross (FreeRTOS PAL, Cortex-M4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-g++
        run: |
          sudo apt-get update
          # gcc-arm-none-eabi does not pull the C++ standard-library headers on
          # current Ubuntu runners. Install the matching newlib package; the
          # compile gate uses arm-none-eabi-g++ and would otherwise fail on
          # the first <cstdint> include.
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Compile target translation units
        run: |
          CXX=arm-none-eabi-g++
          FLAGS="-mcpu=cortex-m4 -mthumb -mfloat-abi=soft -std=c++17 \
                 -fno-exceptions -fno-rtti -fno-threadsafe-statics \
                 -fno-use-cxa-atexit -Os -Wall -Wextra \
                 -DCOACT_ATOMIC64_SHIM \
                 -Itest/renode/freertos -Itest/renode/freertos/include \
                 -Itest/renode/freertos/port -Itest/renode -Iinclude"
          $CXX $FLAGS -c src/core/pal_freertos.cpp -o /tmp/pal_freertos.o
          $CXX $FLAGS -c test/renode/freertos_main.cpp -o /tmp/freertos_main.o
          $CXX $FLAGS -c test/renode/main.cpp -o /tmp/renode_main.o

  # Windows / MSVC job. The windows branch is what the Windows product
  # consumes, and pal_windows.{hpp,cpp} only compile here, so this job is the
  # only place that defect class can be caught. Scope is the host-portable
  # subset (COACT_PORTABLE_ONLY=ON): POSIX-only modules are skipped by CMake
  # with a named message, never silently counted as passing.
  windows-msvc:
    name: windows-msvc (portable subset)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (portable subset)
        run: cmake -B build-win -S . -DCMAKE_BUILD_TYPE=Release -DCOACT_PORTABLE_ONLY=ON

      - name: Declare what this job does and does not cover
        shell: pwsh
        run: |
          Write-Host "=== coact Windows CI scope ==="
          Write-Host "BUILT : core(expected/coordinator), event, queue, staging, policy,"
          Write-Host "        monitor, ao(static), Windows PAL (pal_windows.cpp)"
          Write-Host "SKIPPED by COACT_PORTABLE_ONLY=ON (cannot compile under MSVC):"
          Write-Host "  - coact::coro suite        : ucontext / pthread_setaffinity_np"
          Write-Host "  - timer.hpp / test_timer   : unconditional pthread.h"
          Write-Host "  - POSIX PAL tests          : pal_posix.cpp (pthread/signalfd)"
          Write-Host "  - RT-Thread host-stub tests: test_rtt_pal/test_pal_sync/test_static_*"
          Write-Host "  - fork()-based tests       : test_ao, test_hsm, test_dispatcher_reclaim"
          Write-Host "  - examples                 : POSIX PAL worker threads"
          Write-Host "A skipped suite is NOT a passing suite; run it on the Linux jobs."

      - name: Build
        run: cmake --build build-win --config Release -j 4

      - name: Test
        run: ctest --test-dir build-win -C Release --output-on-failure

  # Target-ABI behaviour, not just compilation: the Renode fixtures boot the
  # admission harness and the FreeRTOS PAL on a Cortex-M4 model. Emulator plus
  # kernel boot is slow, so this job runs weekly or on demand instead of on
  # every push; the arm-cross job already gates the compile side on push.
  renode:
    name: renode (Cortex-M4 admission + FreeRTOS PAL)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi g++-arm-none-eabi mono-complete

      - name: Install Renode (portable, bundles its runtime)
        run: |
          curl -sSL -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.15.3/renode-1.15.3.linux-portable.tar.gz
          mkdir -p "$HOME/renode"
          tar -xzf /tmp/renode.tar.gz -C "$HOME/renode" --strip-components=1
          "$HOME/renode/renode" --version

      - name: Admission harness on Renode
        run: |
          export RENODE="$HOME/renode/renode"
          test/renode/run.sh

      - name: FreeRTOS PAL harness on Renode
        run: |
          export RENODE="$HOME/renode/renode"
          test/renode/freertos.sh
